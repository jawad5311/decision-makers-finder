<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decision Makers Finder</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 310px; margin: 0; padding: 18px; background:#080808; color:#f5f5f5; font:13px Arial,sans-serif; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    header img { width:34px; height:34px; }
    h1 { margin:0; font-size:16px; }
    .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .switch { position:relative; display:inline-block; width:48px; height:26px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; cursor:pointer; border-radius:26px; background:#333; transition:.2s; }
    .slider::before { content:""; position:absolute; width:20px; height:20px; left:3px; bottom:3px; border-radius:50%; background:#fff; transition:.2s; }
    input:checked + .slider { background:#8e44ad; }
    input:checked + .slider::before { transform:translateX(22px); }
    label { font-weight:700; }
    textarea { width:100%; min-height:96px; margin-top:7px; padding:9px; resize:vertical; border:1px solid #333; border-radius:7px; background:#151515; color:#fff; outline:none; }
    textarea:focus { border-color:#8e44ad; }
    button { width:100%; margin-top:10px; padding:10px; border:0; border-radius:7px; color:#fff; font-weight:700; cursor:pointer; }
    #start { background:#8e44ad; }
    #save { background:#292929; }
    #stop { display:none; background:#c0392b; }
    button:disabled { opacity:.42; cursor:not-allowed; }
    #status { min-height:18px; margin-top:12px; color:#bbb; line-height:1.35; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><h1>Decision Makers Finder</h1></header>
  <div class="row">
    <span>Extension</span>
    <label class="switch" aria-label="Enable extension">
      <input id="enabled" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <span>LinkedIn</span>
    <label class="switch" aria-label="Append LinkedIn to searches">
      <input id="linkedIn" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
  <label for="queries">Search queries — one per line</label>
  <textarea id="queries" aria-label="Search queries"></textarea>
  <button id="start" type="button">Find the Decision Makers</button>
  <button id="stop" type="button">Stop Decision Maker Search</button>
  <button id="save" type="button">Save Queries</button>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
